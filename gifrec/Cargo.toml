[package]
name = "gifrec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "輕量、可攜的螢幕錄影轉 GIF 工具（含簡易編輯器）"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive"] }
color_quant = "1"
ctrlc = "3.5.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
gif = "0.14.2"
global-hotkey = "0.10.0"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
rfd = "0.18.0"
softbuffer = "0.4.8"
winit = "0.30.13"
xcap = "0.9.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# gifrec 是獨立的 workspace（自己的 Cargo.lock）
[workspace]
