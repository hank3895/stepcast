name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  licenses:
    name: License check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: poc/Cargo.toml
          command: check licenses bans sources

  windows:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Self-test (encode a synthetic recording)
        run: target/release/stepcast-poc.exe selftest --out selftest.gif
      - uses: actions/upload-artifact@v4
        with:
          name: stepcast-poc-windows
          path: |
            poc/target/release/stepcast-poc.exe
            poc/selftest.gif
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: poc/target/release/stepcast-poc.exe
