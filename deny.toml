# Block strong copyleft (GPL/AGPL/LGPL) dependencies; StepCast is MIT.
# MPL-2.0 is file-level copyleft (Tauri's CSS parser crates); allowed because
# we do not modify those files and their source is public.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
  "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
